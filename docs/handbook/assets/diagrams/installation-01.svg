<svg id="diagram-installation-01" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 168px;" viewBox="4 4 168 696" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-diagram-installation-01" aria-labelledby="chart-title-diagram-installation-01"><title id="chart-title-diagram-installation-01">Installation and capture are separate actions</title><desc id="chart-desc-diagram-installation-01">Setup installs files but never launches the app. After closing Setup, a deliberate launch checks coordination guards and prepares the idle service. Recording requires a separate explicit Start.</desc><style>#diagram-installation-01{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#e6edf3;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-installation-01 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-installation-01 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-installation-01 .error-icon{fill:#161b22;}#diagram-installation-01 .error-text{fill:#e9e4dd;stroke:#e9e4dd;}#diagram-installation-01 .edge-thickness-normal{stroke-width:1px;}#diagram-installation-01 .edge-thickness-thick{stroke-width:3.5px;}#diagram-installation-01 .edge-pattern-solid{stroke-dasharray:0;}#diagram-installation-01 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-installation-01 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-installation-01 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-installation-01 .marker{fill:#8b949e;stroke:#8b949e;}#diagram-installation-01 .marker.cross{stroke:#8b949e;}#diagram-installation-01 svg{font-family:Segoe UI,Arial,sans-serif;font-size:16px;}#diagram-installation-01 p{margin:0;}#diagram-installation-01 .label{font-family:Segoe UI,Arial,sans-serif;color:#e6edf3;}#diagram-installation-01 .cluster-label text{fill:#e9e4dd;}#diagram-installation-01 .cluster-label span{color:#e9e4dd;}#diagram-installation-01 .cluster-label span p{background-color:transparent;}#diagram-installation-01 .label text,#diagram-installation-01 span{fill:#e6edf3;color:#e6edf3;}#diagram-installation-01 .node rect,#diagram-installation-01 .node circle,#diagram-installation-01 .node ellipse,#diagram-installation-01 .node polygon,#diagram-installation-01 .node path{fill:#2d333b;stroke:#6d5dfc;stroke-width:1px;}#diagram-installation-01 .rough-node .label text,#diagram-installation-01 .node .label text,#diagram-installation-01 .image-shape .label,#diagram-installation-01 .icon-shape .label{text-anchor:middle;}#diagram-installation-01 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-installation-01 .rough-node .label,#diagram-installation-01 .node .label,#diagram-installation-01 .image-shape .label,#diagram-installation-01 .icon-shape .label{text-align:center;}#diagram-installation-01 .node.clickable{cursor:pointer;}#diagram-installation-01 .root .anchor path{fill:#8b949e!important;stroke-width:0;stroke:#8b949e;}#diagram-installation-01 .arrowheadPath{fill:#0b0b0b;}#diagram-installation-01 .edgePaths .path{stroke:#8b949e;stroke-width:1px;}#diagram-installation-01 .flowchart-link{stroke:#8b949e;fill:none;}#diagram-installation-01 .edgeLabel{background-color:#2d333b;text-align:center;}#diagram-installation-01 .edgeLabel p{background-color:#2d333b;}#diagram-installation-01 .edgeLabel rect{opacity:0.5;background-color:#2d333b;fill:#2d333b;}#diagram-installation-01 .labelBkg{background-color:rgba(45, 51, 59, 0.5);}#diagram-installation-01 .cluster rect{fill:#161b22;stroke:#30363d;stroke-width:1px;}#diagram-installation-01 .cluster text{fill:#e9e4dd;}#diagram-installation-01 .cluster span{color:#e9e4dd;}#diagram-installation-01 .node .collapsed-indicator{fill:#30363d;stroke:none;opacity:0.6;}#diagram-installation-01 .node .collapsed-separator{stroke:#30363d;stroke-width:0.75px;}#diagram-installation-01 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Segoe UI,Arial,sans-serif;font-size:12px;background:#161b22;border:1px solid hsl(215, 0%, 0.9803921569%);border-radius:2px;pointer-events:none;z-index:100;}#diagram-installation-01 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#e6edf3;}#diagram-installation-01 rect.text{fill:none;stroke-width:0;}#diagram-installation-01 .icon-shape,#diagram-installation-01 .image-shape{background-color:#2d333b;text-align:center;}#diagram-installation-01 .icon-shape p,#diagram-installation-01 .image-shape p{background-color:#2d333b;padding:2px;}#diagram-installation-01 .icon-shape .label rect,#diagram-installation-01 .image-shape .label rect{opacity:0.5;background-color:#2d333b;fill:#2d333b;}#diagram-installation-01 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram-installation-01 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#diagram-installation-01 .node .neo-node{stroke:#6d5dfc;}#diagram-installation-01 [data-look="neo"].node rect,#diagram-installation-01 [data-look="neo"].cluster rect,#diagram-installation-01 [data-look="neo"].node polygon{stroke:#6d5dfc;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-installation-01 [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram-installation-01 [data-look="neo"].node path{stroke:#6d5dfc;stroke-width:1px;}#diagram-installation-01 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-installation-01 [data-look="neo"].node .neo-line path{stroke:#6d5dfc;filter:none;}#diagram-installation-01 [data-look="neo"].node circle{stroke:#6d5dfc;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-installation-01 [data-look="neo"].node circle .state-start{fill:#000000;}#diagram-installation-01 [data-look="neo"].ic